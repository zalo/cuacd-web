# Optional: publishes to the npm registry through trusted publishing (OIDC),
# no tokens or one-time codes. The package is primarily installed from GitHub
# (npm install github:zalo/cuacd-web) so this is manual only. To use it,
# configure once on npmjs.com → package → Settings → Trusted publisher:
# owner "zalo", repository "cuacd-web", workflow "publish.yml", then run it
# from the Actions tab with the version to publish.
name: Publish to npm (manual)
on:
  workflow_dispatch:
    inputs:
      version:
        description: version to publish (e.g. 0.1.1)
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Build the package
        run: |
          deno task npm "${{ github.event.inputs.version }}"
          node scripts/test_npm.mjs
      - name: Publish
        run: npm publish --access public --provenance
