name: Type-check and lint
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check src/mod.ts tests/*.ts
      - run: deno lint
      - run: deno task bundle
      # the GPU test suite needs a WebGPU adapter; run `deno task test` locally
