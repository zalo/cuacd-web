name: Type-check and lint
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: deno check src/mod.ts tests/*.ts
      - run: deno lint
      - run: deno task bundle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the npm package and exercise its CPU path from Node
        run: deno task npm && deno task npm:test
      # the GPU test suite needs a WebGPU adapter; run `deno task test` locally
